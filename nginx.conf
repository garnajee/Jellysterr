proxy_cache_path /var/cache/nginx/tmdb levels=1:2 keys_zone=tmdb_cache:10m max_size=100m inactive=24h use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain application/javascript application/x-javascript text/javascript text/xml text/css application/json;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    }

    location /tmdb/ {
        resolver 1.1.1.1;
        
        rewrite ^/tmdb/(.*) /$1 break;
        
        proxy_pass https://api.themoviedb.org/3/$1?api_key=${TMDB_API_KEY}&$args;
        
        proxy_ssl_server_name on;
        proxy_set_header Host api.themoviedb.org;
        proxy_set_header Connection "";

        proxy_cache tmdb_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 6h;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    }
}
